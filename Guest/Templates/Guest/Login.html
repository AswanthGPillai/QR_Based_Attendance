<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1 align="center">Sign In</h1>

    {% if messages %}
        <div align="center">
            {% for message in messages %}
                <font color="red"><b>{{ message }}</b></font><br>
            {% endfor %}
        </div>
        <br>
    {% endif %}

    <form action="" method="post">
        {% csrf_token %}
        <table border="1" cellpadding="8" align="center">
            <tr>
                <td>Role</td>
                <td>
                    <select name="sel_role" required>
                        <option value="Admin">Admin</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Student">Student (User)</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="txt_email" required placeholder="Enter Email"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="txt_password" required placeholder="Enter Password"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Login">
                    <input type="reset" value="Cancel">
                </td>
            </tr>
        </table>
    </form>

    <br>
    <div align="center">
        <p>Default Admin: <b>admin@imca.com</b> | Password: <b>admin123</b></p>
        <p>New Student? <a href="{% url 'Guest:user_registration' %}">Register Here</a></p>
        <p><a href="{% url 'Guest:homepage' %}">Back to Home</a></p>
    </div>
</body>
</html>
