<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
</head>
<body>
    <table width="100%" bgcolor="#e6ffe6" cellpadding="10" border="1">
        <tr>
            <td><h2>Teacher Portal</h2></td>
            <td align="right">
                <a href="{% url 'Teacher:teacher_dashboard' %}">Dashboard</a> |
                <a href="{% url 'Teacher:my_profile' %}">My Profile</a> |
                <a href="{% url 'Teacher:view_timetable' %}">View Timetable</a> |
                <a href="{% url 'Teacher:select_period_for_qr' %}">Generate QR Attendance</a> |
                <a href="{% url 'Teacher:view_attendance' %}">View Attendance</a> |
                <a href="{% url 'Guest:logout' %}">Logout</a>
            </td>
        </tr>
    </table>

    <h1 align="center">Change Password</h1>

    {% if messages %}
        <div align="center">
            {% for message in messages %}
                <font color="red"><b>{{ message }}</b></font><br>
            {% endfor %}
        </div>
        <br>
    {% endif %}

    <form action="" method="post">
        {% csrf_token %}
        <table border="1" cellpadding="8" align="center">
            <tr>
                <td>Current Password</td>
                <td><input type="password" name="txt_curr_pass" required></td>
            </tr>
            <tr>
                <td>New Password</td>
                <td><input type="password" name="txt_new_pass" required></td>
            </tr>
            <tr>
                <td>Confirm Password</td>
                <td><input type="password" name="txt_confirm_pass" required></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Change Password">
                    <input type="reset" value="Cancel">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
