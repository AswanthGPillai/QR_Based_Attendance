<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
</head>
<body>
    <table width="100%" bgcolor="#fff0e6" cellpadding="10" border="1">
        <tr>
            <td><h2>Student Portal</h2></td>
            <td align="right">
                <a href="{% url 'Student:student_dashboard' %}">Dashboard</a> |
                <a href="{% url 'Student:my_profile' %}">My Profile</a> |
                <a href="{% url 'Student:view_timetable' %}">View Timetable</a> |
                <a href="{% url 'Student:scan_qr' %}">Scan Attendance</a> |
                <a href="{% url 'Student:view_attendance' %}">View Attendance</a> |
                <a href="{% url 'Student:complaints' %}">Complaints</a> |
                <a href="{% url 'Guest:logout' %}">Logout</a>
            </td>
        </tr>
    </table>

    <h1 align="center">Edit Profile</h1>

    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <table border="1" cellpadding="8" align="center">
            <tr>
                <td>Name</td>
                <td><input type="text" name="txt_name" value="{{ student.student_name }}" required></td>
            </tr>
            <tr>
                <td>Contact</td>
                <td><input type="text" name="txt_contact" value="{{ student.student_contact }}" required></td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea name="txt_address" rows="3" cols="25">{{ student.student_address }}</textarea></td>
            </tr>
            <tr>
                <td>Photo</td>
                <td><input type="file" name="file_photo"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Update">
                    <input type="reset" value="Cancel">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
